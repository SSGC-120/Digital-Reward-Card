const congratsBanner = document.getElementById('congrats-banner');
const resetBtn = document.getElementById('reset-btn');
const progressText = document.getElementById('progress-text');
const modal = document.getElementById('confirm-modal');
const modalCancel = document.getElementById('modal-cancel');
const modalConfirm = document.getElementById('modal-confirm');
const comboModal = document.getElementById('combo-modal');
const comboCancel = document.getElementById('combo-cancel');
const comboConfirm = document.getElementById('combo-confirm');
let currentRedeemingComboId = null; 

function triggerCelebration() {
    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#ffd700', '#003366', '#ffffff'] });
}

function getCollectedStamps() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { return []; }
}
function saveCollectedStamps(stampsArray) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stampsArray));
}
function getRedeemedCombos() {
    try { return JSON.parse(localStorage.getItem(COMBO_REDEEMED_KEY)) || []; } catch (e) { return []; }
}
function saveRedeemedCombos(redeemedArray) {
    localStorage.setItem(COMBO_REDEEMED_KEY, JSON.stringify(redeemedArray));
}

// Anti-Speedrun Check (Prevents scanning faster than 15 seconds)
function checkSpeedLimit() {
    const lastScanTime = localStorage.getItem('ssgc_last_scan_time');
    const now = Date.now();
    if (lastScanTime && (now - parseInt(lastScanTime)) < 15000) { return false; }
    localStorage.setItem('ssgc_last_scan_time', now.toString());
    return true; 
}

function checkComboStatus(stamps, keys, requiredCount) {
    let count = 0;
    for (let i = 0; i < stamps.length; i++) {
        if (keys.includes(stamps[i])) count++;
    }
    return count >= requiredCount;
}

function getUnlockIndex(keys, requiredCount, collectedStamps) {
    let count = 0;
    for (let i = 0; i < collectedStamps.length; i++) {
        if (keys.includes(collectedStamps[i])) {
            count++;
            if (count === requiredCount) return i; 
        }
    }
    return -1; 
}

function updateUI() {
    const collectedStamps = getCollectedStamps();
    const count = collectedStamps.length;
    const emptyBoxes = document.querySelectorAll('.stamp-box.empty');

    emptyBoxes.forEach((box, index) => {
        if (index < count) {
            box.classList.add('unlocked');
            const stampId = collectedStamps[index];
            box.innerText = stampEmojis[stampId] || "✨"; 
        } else {
            box.classList.remove('unlocked');
            box.innerText = '';
        }
    });

    progressText.innerText = `Stamps Collected 印花進度: ${Math.min(count, TARGET_STAMPS)} / ${TARGET_STAMPS}`;

    if (count >= TARGET_STAMPS) {
        congratsBanner.style.display = 'block';
        resetBtn.disabled = false;
    } else {
        congratsBanner.style.display = 'none';
        resetBtn.disabled = true;
    }
  
    // Automated Combo Image Rendering
    const redeemedCombos = getRedeemedCombos();
    combos.forEach(c => {
        const unlockIndex = getUnlockIndex(c.keys, c.req, collectedStamps);
        const img = document.getElementById(c.img);
        if (img) {
            img.style.display = (unlockIndex !== -1 && !redeemedCombos.includes(c.img)) ? 'block' : 'none';
            img.style.order = unlockIndex;
        }
    });
}

// Ensure cross-tab syncing works for iOS/Android popup browsers
window.addEventListener('storage', function(event) {
    if (event.key === STORAGE_KEY || event.key === COMBO_REDEEMED_KEY) updateUI();
});

// Handle URL scanning
const urlParams = new URLSearchParams(window.location.search);
const scannedStamp = urlParams.get('stamp');

if (scannedStamp) {
    if (stampEmojis.hasOwnProperty(scannedStamp)) {
        let collectedStamps = getCollectedStamps();
        
        if (!collectedStamps.includes(scannedStamp) && collectedStamps.length < TARGET_STAMPS) {
            
            // Check Speed Limit (15 seconds)
            if (!checkSpeedLimit()) {
                alert("You are scanning too fast! Please wait a moment before scanning again. \n\n您掃描得太快了！請稍等片刻再掃描。");
            } else {
                // 1. Get status BEFORE adding new stamp
                const previousStatus = combos.map(c => checkComboStatus(collectedStamps, c.keys, c.req));
        
                // 2. Add stamp
                collectedStamps.push(scannedStamp);
                saveCollectedStamps(collectedStamps);
                
                // 3. Trigger celebration if something NEW unlocked
                let shouldCelebrate = false;
                combos.forEach((c, index) => {
                    const isDoneNow = checkComboStatus(collectedStamps, c.keys, c.req);
                    if (!previousStatus[index] && isDoneNow) shouldCelebrate = true;
                });
                
                if (collectedStamps.length === TARGET_STAMPS) shouldCelebrate = true;
                if (shouldCelebrate) setTimeout(triggerCelebration, 300); 
            }
        }
    }
    // Clear URL parameters
    window.history.replaceState(null, '', window.location.pathname);
}

// Initial UI Load
updateUI();

// Modals
resetBtn.addEventListener('click', () => modal.style.display = 'flex');
modalCancel.addEventListener('click', () => modal.style.display = 'none');
modalConfirm.addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(COMBO_REDEEMED_KEY);
    modal.style.display = 'none';
    updateUI();
});

const allComboImages = document.querySelectorAll('.bonus-img');
allComboImages.forEach(img => {
    img.addEventListener('click', function() {
        currentRedeemingComboId = this.id;
        comboModal.style.display = 'flex';
    });
});

comboCancel.addEventListener('click', () => {
    comboModal.style.display = 'none';
    currentRedeemingComboId = null;
});

comboConfirm.addEventListener('click', () => {
    if (currentRedeemingComboId) {
        const redeemed = getRedeemedCombos();
        if (!redeemed.includes(currentRedeemingComboId)) {
            redeemed.push(currentRedeemingComboId);
            saveRedeemedCombos(redeemed);
        }
        comboModal.style.display = 'none';
        currentRedeemingComboId = null;
        updateUI(); 
    }
});
